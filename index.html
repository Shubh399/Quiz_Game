<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Project-1(Quiz Game)</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="container">
            <!-- start screen -->
            <div class="screen active" id="start-screen">
                <h1>Quiz Time</h1>
                <p>Test your Knowledge with these funny Questions</p>
                <button type="button" id="start-btn">Start Quiz</button>
            </div>

            <!-- quiz sceen -->
            <div class="quiz-screen" id="quiz-screen">
                <div class="quiz-header">
                    <h2 id="questions-text">questions goes here</h2>
                </div>
                <div class="quiz-info">
                    <span>

                        Question <span id="current-question">1</span>of  5

                   </span>
                    <p id="score_board">
                        Score :<span id="Score"></span>
                    </p>
                </div>
            </div>

            <div class="answers-container" id="answers-container">
                <button type="submit" class="answer">Select your answer</button>
                <button type="submit" class="answer">Select your answer</button>
                <button type="submit" class="answer">Select your answer</button>
                <button type="submit" class="answer">Select your answer</button>
                
            </div>
            <!-- result screen -->
            <div class="result-screen" id="result-screen">
                <h1>Quiz Results</h1>
                <div class="result-info">
                    <p>You score <span id="final-score"> 0 </span> out of <span id="max-score">5</span></p>
                    <div class="result-msg">
                        <p id="result-message"></p>
                    </div>
                </div>
                <div class="restart" id="restart">
                    <button type="button" id="restart-btn">Restart</button>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>

</html>
